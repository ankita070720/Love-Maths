<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="assets/css/style.css" rel="stylesheet" type="text/css" /> 
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.2/css/all.css" integrity="sha384-fnmOCqbTlWIlj8LyTjo7mOUStjsKC4pOpQbqyi7RrhN7udi9RwhKkMHpvLbHG9Sr" crossorigin="anonymous"> 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

<link href="https://fonts.googleapis.com/css?family=Raleway%7CRighteous" rel="stylesheet">
 
    <title>LOVE MATHS</title>
</head>
<body>
    <heading class="heading mx-auto my-3">
        <img src="assets/images/logo.png" alt="logo" />
        <h1>Love Maths</h1>
    </heading>
    <main class="container">
        <div class="p-5" id="full-area">
        
<section class="game-area">
    <div class="controls-area">
        
        <button data-type="addition" class="icon-area btn btn-outline-success rounded-circle circle-btn-lg"><i class="fas fa-plus"></i></button>
        <button data-type="subtract" class="icon-area btn btn-outline-primary rounded-circle circle-btn-lg"><i class="fas fa-minus"></i></button>
        <button data-type="multiply" class="icon-area btn btn-outline-warning rounded-circle circle-btn-lg"><i class="fas fa-times"></i></button>
        <button data-type="division" class="icon-area btn btn-outline-danger rounded-circle circle-btn-lg"><i class="fas fa-divide"></i></button>
    </div>
    <div class="controls-area">
    <p>Addition</p>
    <p>Addition</p>
    <p>Addition</p>
    <p>Addition</p>
    </div>
    <div class="question-area">
        <span id="operand1">0</span>
        <span id="operator">x</span>
        <span id="operator2">0</span>
        <span>=</span>
        <!-- <p class="answer-message">Enter Answer:</p> -->
        <input id="answer-box" type="number"/>
        
    </div>
    <div class="d-flex justify-content-center mt-4"><input type="submit" class="form-control" value="Submit Answer"></div>
    
</section>

    </div>

<section class="score-area">
    <p>Correct Answer:<span id="correct">0</span></p>
     <p>InCorrect Answer:<span id="incorrect">0</span></p>
</section>
   
 
    </main>
    

   
    <script src="assets/javascript/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
