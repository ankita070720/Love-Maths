<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="assets/css/style.css" rel="stylesheet" type="text/css" /> 
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.2/css/all.css" integrity="sha384-fnmOCqbTlWIlj8LyTjo7mOUStjsKC4pOpQbqyi7RrhN7udi9RwhKkMHpvLbHG9Sr" crossorigin="anonymous"> 

<link href="https://fonts.googleapis.com/css?family=Raleway%7CRighteous" rel="stylesheet">
 
    <title>LOVE MATHS</title>
</head>
<body>
    <heading>
        <img src="assets/images/logo.png" alt="logo" />
        <h1>Love Maths</h1>
    </heading>
<section class="game-area">
    <div class="controls-area">
        <button class="btn btn--big btn--green"><i class="fas fa-plus"></i></button>
        <button class="btn btn--big btn--blue"><i class="fas fa-minus"></i></button>
        <button class="btn btn--big btn--orange"><i class="fas fa-times"></i></button>
<i class="fas fa-divide"></i></button>
    </div>
    <div class="question-area">
        <span id="operand1">0</span>
        <span id="operator">x</span>
        <span id="operator2">0</span>
        <span>=</span>
        <p class="answer-message">Enter Answer:</p>
        <input id="answer-box" type="number"/>
        <button class="btn btn--gray">Submit Answer</button>
    </div>
</section>
<section class="score-area">
    <p>Correct Answer:<span id="correct">0</span></p>
     <p>InCorrect Answer:<span id="incorrect">0</span></p>
</section>

   
    <script src="assets/javascript/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
